<!DOCTYPE html>
<html>
<head>
  <title>StockMind Lite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>📈 StockMind Lite</h1>

  <div class="card">
    <h2>📊 Market Opinion</h2>
    <p>Market is slightly bullish due to strong buying.</p>
  </div>

  <div class="card">
    <h2>💡 Daily Tip</h2>
    <p>Always use stop loss in every trade.</p>
  </div>

  <div class="card">
    <h2>📚 Learn</h2>
    <button onclick="learn()">Start Learning</button>
  </div>

  <div class="card">
    <h2>⚡ Practice</h2>
    <button onclick="buy()">Buy</button>
    <button onclick="sell()">Sell</button>
    <p id="balance">Balance: ₹10000</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
