<!DOCTYPE html>
<html>
<head>
  <title>StockMind Lite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>📈 StockMind</h1>

  <div class="nav">
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('learn')">Learn</button>
    <button onclick="showPage('practice')">Practice</button>
    <button onclick="showPage('quiz')">Quiz</button>
  </div>

  <!-- HOME -->
  <div id="home" class="page">
    <div class="card">
      <h2>📊 Market</h2>
      <p id="market"></p>
    </div>

    <div class="card">
      <h2>💡 Tip</h2>
      <p id="tip"></p>
    </div>

    <div class="card">
      <h2>🔥 Streak</h2>
      <p id="streak"></p>
    </div>
  </div>

  <!-- LEARN -->
  <div id="learn" class="page">
    <div class="card">
      <h2>📚 What is Stock?</h2>
      <p>A stock means you own a small part of a company.</p>
    </div>

    <div class="card">
      <h2>📉 What is Risk?</h2>
      <p>Risk means chance of losing money.</p>
    </div>
  </div>

  <!-- PRACTICE -->
  <div id="practice" class="page">
    <div class="card">
      <h2>💰 Balance</h2>
      <p id="balance">₹10000</p>
      <button onclick="buy()">Buy</button>
      <button onclick="sell()">Sell</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="page">
    <div class="card">
      <h2>🧠 Quiz</h2>
      <p>What is stock?</p>
      <button onclick="check(1)">Ownership</button>
      <button onclick="check(0)">Loan</button>
      <p id="result"></p>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>  <h2>📰 News</h2>
  <p>Market rises due to positive global cues.</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
